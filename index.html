<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Fatima❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#ff6a88,#ff99ac);
color:white;
overflow-x:hidden;
text-align:center;
}

/* STAR BACKGROUND */

.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:moveStars 60s linear infinite;
opacity:.5;
z-index:-3;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

/* START SCREEN */

#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff4e72,#ff7eb3);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

#startScreen h1{
font-size:42px;
margin-bottom:20px;
}

button{
padding:12px 28px;
border:none;
border-radius:25px;
font-size:16px;
cursor:pointer;
background:white;
color:#ff4f70;
margin:10px;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

/* MAIN */

.container{
max-width:900px;
margin:auto;
padding:30px;
}

h1{
font-size:50px;
}

/* TYPING TEXT */

#typed{
font-size:20px;
min-height:100px;
line-height:1.6;
}

/* 3D PHOTO CARDS */

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:25px;
}

.card{
width:200px;
height:250px;
perspective:1000px;
}

.card-inner{
position:relative;
width:100%;
height:100%;
transition:transform .8s;
transform-style:preserve-3d;
}

.card:hover .card-inner{
transform:rotateY(180deg);
}

.card-front,.card-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,.4);
}

.card-front img{
width:100%;
height:100%;
object-fit:cover;
}

.card-back{
background:white;
color:#ff4f70;
display:flex;
align-items:center;
justify-content:center;
transform:rotateY(180deg);
font-weight:bold;
padding:10px;
}

/* RANDOM MESSAGE */

#messageBox{
font-size:20px;
margin-top:10px;
min-height:30px;
}

/* HEART */

.heart{
position:absolute;
width:15px;
height:15px;
background:red;
transform:rotate(45deg);
animation:float 4s linear forwards;
}

.heart:before,.heart:after{
content:'';
width:15px;
height:15px;
background:red;
border-radius:50%;
position:absolute;
}

.heart:before{top:-7px;}
.heart:after{left:-7px;}

@keyframes float{
0%{opacity:1;transform:translateY(0) rotate(45deg);}
100%{opacity:0;transform:translateY(-200px) rotate(45deg);}
}

/* ROSE PETALS */

.petal{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

/* POPUP LETTER */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
color:#444;
padding:30px;
border-radius:15px;
max-width:400px;
}

/* CURSOR TRAIL */

.trail{
position:fixed;
width:10px;
height:10px;
background:pink;
border-radius:50%;
pointer-events:none;
animation:trail 1s linear forwards;
}

@keyframes trail{
to{transform:scale(0);opacity:0;}
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- START SCREEN -->

<div id="startScreen">
<h1>💖 A Surprise For You 💖</h1>
<button onclick="startSurprise()">Start</button>
</div>

<!-- MAIN CONTENT -->

<div class="container">

<h1>🎉 Happy Birthday My Love 🎉</h1>

<p id="typed"></p>

<div class="gallery" id="gallery"></div>

<button onclick="newMessage()">Another Message ❤️</button>

<p id="messageBox"></p>

<button onclick="showLetter()">Open My Letter 💌</button>

</div>

<!-- LETTER -->

<div class="popup" id="popup">

<div class="popup-content">

<h2>For You ❤️</h2>

<p>
You entered my life and made everything brighter.
Your smile turns my worst days into beautiful ones.
I'm grateful for every moment with you.

Happy Birthday to the most special person in my life.
</p>

<button onclick="closeLetter()">Close</button>

</div>

</div>

<!-- MUSIC -->

<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* START */

function startSurprise(){

document.getElementById("startScreen").style.display="none";

const music=document.getElementById("bgMusic");

if(music){
music.play().catch(()=>{});
}

}

/* TYPING */

const text="From the moment you came into my life everything became brighter. I’m lucky to have you and I can't wait to celebrate many more birthdays together. ❤️";

let i=0;

function typing(){
if(i<text.length){
document.getElementById("typed").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,40);
}
}

typing();

/* PHOTO CARDS (ADD PHOTOS HERE) */

const photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg",
"photo6.jpg"
"photo7.jpg"
"photo8.jpg"
"photo9.jpg"
"photo10.jpg"
"photo11.jpg"
];

const gallery=document.getElementById("gallery");

photos.forEach(p=>{

gallery.innerHTML+=`

<div class="card">
<div class="card-inner">
<div class="card-front">
<img src="${p}">
</div>
<div class="card-back">
Beautiful Memory ❤️
</div>
</div>
</div>

`;

});

/* RANDOM MESSAGES */

const messages=[
"You make my world brighter ❤️",
"I’m lucky to have you 💕",
"You are my favorite person 💖",
"My heart chose you ❤️",
"Every moment with you matters ✨"
];

function newMessage(){

const random=messages[Math.floor(Math.random()*messages.length)];

document.getElementById("messageBox").innerText=random;

}

/* HEART ON CLICK */

document.addEventListener("click",function(e){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.style.left=e.clientX+"px";
heart.style.top=e.clientY+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),2000);

});

/* CURSOR TRAIL */

document.addEventListener("mousemove",function(e){

const trail=document.createElement("div");

trail.classList.add("trail");

trail.style.left=e.clientX+"px";
trail.style.top=e.clientY+"px";

document.body.appendChild(trail);

setTimeout(()=>trail.remove(),1000);

});

/* PETALS */

function createPetal(){

const petal=document.createElement("div");

petal.classList.add("petal");

petal.innerHTML="🌹";

petal.style.left=Math.random()*100+"vw";

petal.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(petal);

setTimeout(()=>petal.remove(),8000);

}

setInterval(createPetal,500);

/* LETTER */

function showLetter(){

document.getElementById("popup").style.display="flex";

confetti({particleCount:150,spread:90,origin:{y:0.6}});

}

function closeLetter(){

document.getElementById("popup").style.display="none";

}

</script>

</body>
</html>
