<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Fatima ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* GLOBAL */

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff6a88,#ff99ac);
color:white;
overflow-x:hidden;
text-align:center;
}

/* STAR BACKGROUND */

.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:moveStars 60s linear infinite;
opacity:.4;
z-index:-1;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

/* START SCREEN */

#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff4e72,#ff7eb3);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

#startScreen h1{
font-size:45px;
margin-bottom:20px;
}

button{
padding:12px 28px;
border:none;
border-radius:25px;
font-size:16px;
cursor:pointer;
background:white;
color:#ff4f70;
margin:10px;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

/* MAIN CONTENT */

.container{
max-width:800px;
margin:auto;
padding:30px;
}

h1{
font-size:50px;
}

/* TYPING TEXT */

#typed{
font-size:20px;
min-height:100px;
line-height:1.6;
}

/* SLIDESHOW */

.gallery{
margin-top:20px;
width:280px;
height:280px;
margin-left:auto;
margin-right:auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.gallery img{
width:100%;
height:100%;
object-fit:cover;
}

/* RANDOM MESSAGE */

#messageBox{
font-size:20px;
margin-top:10px;
min-height:30px;
}

/* HEART */

.heart{
position:absolute;
width:15px;
height:15px;
background:red;
transform:rotate(45deg);
animation:float 4s linear forwards;
}

.heart:before,
.heart:after{
content:'';
width:15px;
height:15px;
background:red;
border-radius:50%;
position:absolute;
}

.heart:before{top:-7px;}
.heart:after{left:-7px;}

@keyframes float{
0%{opacity:1;transform:translateY(0) rotate(45deg);}
100%{opacity:0;transform:translateY(-200px) rotate(45deg);}
}

/* POPUP LETTER */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
color:#444;
padding:30px;
border-radius:15px;
max-width:400px;
}

.popup-content h2{
color:#ff4f70;
}

/* CURSOR HEART TRAIL */

.trail{
position:fixed;
width:10px;
height:10px;
background:pink;
border-radius:50%;
pointer-events:none;
animation:trail 1s linear forwards;
}

@keyframes trail{
to{transform:scale(0);opacity:0;}
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- START SCREEN -->

<div id="startScreen">
<h1>💖 A Surprise For You 💖</h1>
<button onclick="startSurprise()">Start</button>
</div>

<!-- MAIN CONTENT -->

<div class="container">

<h1>🎉 Happy Birthday My Love 🎉</h1>

<p id="typed"></p>

<div class="gallery">
<img id="slide" src="photo1.jpg">
</div>

<div>
<button onclick="newMessage()">Another Message ❤️</button>
<p id="messageBox"></p>
</div>

<button onclick="showLetter()">Open My Letter 💌</button>

</div>

<!-- POPUP -->

<div class="popup" id="popup">
<div class="popup-content">

<h2>For You ❤️</h2>

<p>
You came into my life and made everything brighter.
Your smile makes my hardest days easier and your love
makes my world complete.

I’m thankful for every moment with you.

Happy Birthday to the most beautiful person in my life.
</p>

<button onclick="closeLetter()">Close</button>

</div>
</div>

<!-- MUSIC -->

<audio loop>
<source src="song.mp3" type="audio/mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* START */

function startSurprise(){

document.getElementById("startScreen").style.display="none";
document.querySelector("audio").play();

}

/* TYPING MESSAGE */

const text="From the moment you entered my life, everything became brighter. You make my days happier and my heart calmer. I’m lucky to have you and I can't wait to celebrate many more birthdays with you. ❤️";

let i=0;

function typing(){
if(i<text.length){
document.getElementById("typed").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,40);
}
}

typing();

/* PHOTO GALLERY (ADD MORE PHOTOS HERE) */

const photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg"
"photo6.jpg"
"photo7.jpg"
"photo8.jpg"
"photo9.jpg"
"photo10.jpg"
"photo11.jpg"
];

let index=0;

setInterval(()=>{

index=(index+1)%photos.length;

document.getElementById("slide").src=photos[index];

},3000);

/* RANDOM LOVE MESSAGES */

const messages=[
"You make my world brighter ❤️",
"I’m lucky to have you 💕",
"You are my favorite person 💖",
"My heart chose you ❤️",
"Every moment with you matters ✨"
];

function newMessage(){

const random=messages[Math.floor(Math.random()*messages.length)];

document.getElementById("messageBox").innerText=random;

}

/* CLICK HEARTS */

document.addEventListener("click",function(e){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.style.left=e.clientX+"px";
heart.style.top=e.clientY+"px";

document.body.appendChild(heart);

setTimeout(()=>{heart.remove();},2000);

});

/* LETTER POPUP */

function showLetter(){

document.getElementById("popup").style.display="flex";

confetti({
particleCount:150,
spread:90,
origin:{y:0.6}
});

}

function closeLetter(){

document.getElementById("popup").style.display="none";

}

/* CURSOR HEART TRAIL */

document.addEventListener("mousemove",function(e){

const trail=document.createElement("div");

trail.classList.add("trail");

trail.style.left=e.clientX+"px";
trail.style.top=e.clientY+"px";

document.body.appendChild(trail);

setTimeout(()=>{trail.remove();},1000);

});

</script>

</body>
</html>
